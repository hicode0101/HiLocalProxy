name: Release

# 推送 v 开头的版本号 tag 时触发，例如 v1.0.3
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 版本号一致性校验：tag 必须为 vX.Y.Z 格式，且与 main.go 中 AppVersion 完全一致
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 tag 与代码输出版本号一致
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CODE_VERSION="$(sed -n 's/^var AppVersion = "\(.*\)"$/\1/p' HiLocalProxy/main.go | head -n1)"

          if [ -z "${CODE_VERSION}" ]; then
            echo "::error title=版本号解析失败::无法从 HiLocalProxy/main.go 解析 AppVersion，请确认代码中存在：var AppVersion = \"vX.Y.Z\""
            exit 1
          fi

          if ! echo "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=tag 格式错误::tag（${TAG}）必须为 vX.Y.Z 格式，例如 v1.0.3"
            exit 1
          fi

          if [ "${TAG}" != "${CODE_VERSION}" ]; then
            echo "::error title=版本号不一致::tag（${TAG}）与代码输出版本号（${CODE_VERSION}）不一致，请修改 HiLocalProxy/main.go 中的 AppVersion 后重新打 tag"
            exit 1
          fi

          echo "版本校验通过：tag = 代码输出版本号 = ${TAG}"

  # 四平台构建矩阵：
  # - Linux / Windows：在 Ubuntu runner 上交叉编译
  # - macOS Apple Silicon (arm64)：在 macOS ARM runner 上原生编译
  # - macOS Intel (amd64)：在 macOS ARM 平台上交叉编译出 Intel 版本
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - target: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: macos-arm64
            runner: macos-latest        # Apple Silicon (ARM64) runner，原生编译 M 系列
            goos: darwin
            goarch: arm64
            ext: ""
          - target: macos-amd64
            runner: macos-latest        # macOS ARM 平台上交叉编译 Intel (amd64) 版本
            goos: darwin
            goarch: amd64
            ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（版本跟随 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: HiLocalProxy/go.mod

      - name: 构建 ${{ matrix.target }}
        env:
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          OUTDIR="HiLocalProxy-${{ matrix.target }}-${TAG}"
          mkdir -p "${OUTDIR}"

          # GOOS/GOARCH 与宿主不同时 Go 自动禁用 cgo，纯 Go 项目可放心交叉编译
          ( cd HiLocalProxy && CGO_ENABLED=0 go build -trimpath -ldflags "-w -s" )
          mv "HiLocalProxy/HiLocalProxy${EXT}" "${OUTDIR}/"
          cp HiLocalProxy/config.json "${OUTDIR}/"

          # 校验产物中包含 tag 对应的版本号
          if ! grep -aqF "${TAG}" "${OUTDIR}/HiLocalProxy${EXT}"; then
            echo "::error title=产物版本校验失败::${OUTDIR} 二进制中未找到版本号 ${TAG}"
            exit 1
          fi

          zip -r "${OUTDIR}.zip" "${OUTDIR}"
          rm -rf "${OUTDIR}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: HiLocalProxy-${{ matrix.target }}-${{ github.ref_name }}.zip
          if-no-files-found: error

  # 汇总 4 个平台产物，创建 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 检查产物数量
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          COUNT="$(ls dist/*.zip | wc -l | tr -d ' ')"
          if [ "${COUNT}" -ne 4 ]; then
            echo "::error title=产物数量异常::期望 4 个平台的发布包，实际 ${COUNT} 个"
            exit 1
          fi

      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 本 job 未检出仓库（无 .git），必须用 -R 显式指定目标仓库
          if gh release view "${TAG}" -R "${REPO}" > /dev/null 2>&1; then
            echo "Release ${TAG} 已存在，仅覆盖上传产物（支持失败后重跑）"
            gh release upload "${TAG}" dist/*.zip -R "${REPO}" --clobber
          else
            gh release create "${TAG}" dist/*.zip -R "${REPO}" \
              --title "HiLocalProxy ${TAG}" \
              --generate-notes
          fi
